name: "ASURA HUNTER // 24/7 KARNATAKA CLOUD RADAR"

on:
  schedule:
    # Runs autonomously every hour on GitHub Actions cloud (zero laptop required)
    - cron: '0 * * * *'
  workflow_dispatch: # Allows 1-click manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

concurrency:
  group: hunter-cloud-runner
  cancel-in-progress: false

jobs:
  karnataka_radar_sweep:
    name: "24/7 Karnataka Autonomous Lead Scraper"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Trigger Vercel Edge Cloud Radar
        run: |
          echo "⚡ [ASURA CLOUD RADAR] Pinging Vercel Serverless Edge with Security Key..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" "https://asura-system.vercel.app/api/cron_hunt?key=asura-sovereign-radar-2026")
          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          if [ "$STATUS" -eq "200" ]; then
            echo "✅ Successfully executed hourly Karnataka lead sweep on Vercel Serverless!"
          else
            echo "⚠️ Non-200 status received: $STATUS. Check endpoint logs."
          fi
