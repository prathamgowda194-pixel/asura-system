<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 800" width="100%" height="100%">
  <defs>
    <!-- Metallic Steel Gradients -->
    <linearGradient id="blue-steel-case" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="75%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <radialGradient id="blue-steel-radial" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#f8fafc" />
      <stop offset="85%" stop-color="#94a3b8" />
      <stop offset="95%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#334155" />
    </radialGradient>
    <!-- Deep Navy Sunburst Dial -->
    <radialGradient id="navy-sunburst-dial" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="35%" stop-color="#1d4ed8" />
      <stop offset="70%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0b132b" />
    </radialGradient>
    <!-- Navy Vulcanized Rubber Strap -->
    <linearGradient id="blue-strap-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="20%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="80%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <!-- Curved Glass Specular Glare -->
    <linearGradient id="blue-glass-glare" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="90%" stop-color="#ffffff" stop-opacity="0.2" />
    </linearGradient>
    <!-- Drop Shadow -->
    <filter id="blue-watch-shadow" x="-20%" y="-10%" width="140%" height="120%">
      <feDropShadow dx="0" dy="25" stdDeviation="28" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <g filter="url(#blue-watch-shadow)">
    <!-- Top Rubber Strap -->
    <path d="M185,150 L195,40 Q250,30 305,40 L315,150 Z" fill="url(#blue-strap-grad)" />
    <!-- Textured Herringbone Pattern -->
    <path d="M205,60 L295,60 M203,80 L297,80 M200,100 L300,100 M197,120 L303,120 M195,140 L305,140" stroke="#0b132b" stroke-width="2" opacity="0.65" />
    <!-- White Contrast Stitching -->
    <line x1="193" y1="42" x2="183" y2="150" stroke="#e0f2fe" stroke-width="2.5" stroke-dasharray="5 4" opacity="0.9" />
    <line x1="307" y1="42" x2="317" y2="150" stroke="#e0f2fe" stroke-width="2.5" stroke-dasharray="5 4" opacity="0.9" />

    <!-- Bottom Rubber Strap -->
    <path d="M185,650 L195,760 Q250,770 305,760 L315,650 Z" fill="url(#blue-strap-grad)" />
    <!-- Textured Herringbone Pattern -->
    <path d="M195,660 L305,660 M197,680 L303,680 M200,700 L300,700 M203,720 L297,720 M205,740 L295,740" stroke="#0b132b" stroke-width="2" opacity="0.65" />
    <!-- White Contrast Stitching -->
    <line x1="183" y1="650" x2="193" y2="758" stroke="#e0f2fe" stroke-width="2.5" stroke-dasharray="5 4" opacity="0.9" />
    <line x1="317" y1="650" x2="307" y2="758" stroke="#e0f2fe" stroke-width="2.5" stroke-dasharray="5 4" opacity="0.9" />

    <!-- Steel Lugs -->
    <path d="M175,250 C170,210 178,160 185,145 L205,145 C198,165 195,205 195,250 Z" fill="url(#blue-steel-case)" stroke="#334155" stroke-width="1" />
    <path d="M325,250 C330,210 322,160 315,145 L295,145 C302,165 305,205 305,250 Z" fill="url(#blue-steel-case)" stroke="#334155" stroke-width="1" />
    <path d="M175,550 C170,590 178,640 185,655 L205,655 C198,635 195,595 195,550 Z" fill="url(#blue-steel-case)" stroke="#334155" stroke-width="1" />
    <path d="M325,550 C330,590 322,640 315,655 L295,655 C302,635 305,595 305,550 Z" fill="url(#blue-steel-case)" stroke="#334155" stroke-width="1" />

    <!-- Screw-Down Crown with Embossed Omega Symbol -->
    <path d="M380,380 L398,382 C402,382 405,386 405,400 C405,414 402,418 398,418 L380,420 Z" fill="url(#blue-steel-case)" stroke="#475569" stroke-width="1.5" />
    <line x1="388" y1="383" x2="388" y2="417" stroke="#0f172a" stroke-width="1.5" />
    <line x1="394" y1="383" x2="394" y2="417" stroke="#0f172a" stroke-width="1.5" />
    <line x1="400" y1="385" x2="400" y2="415" stroke="#0f172a" stroke-width="1.5" />

    <!-- Main Steel Case Outer Ring -->
    <circle cx="250" cy="400" r="140" fill="url(#blue-steel-case)" stroke="#475569" stroke-width="2" />
    
    <!-- Polished Bezel Chamfer -->
    <circle cx="250" cy="400" r="126" fill="url(#blue-steel-radial)" stroke="#64748b" stroke-width="1.5" />
    <circle cx="250" cy="400" r="122" fill="#0f172a" />

    <!-- Navy Teak Dial Surface -->
    <circle cx="250" cy="400" r="118" fill="url(#navy-sunburst-dial)" />

    <!-- Horizontal Teak Planks Texture -->
    <g stroke="#09142b" stroke-width="1.5" opacity="0.7">
      <line x1="140" y1="300" x2="360" y2="300" />
      <line x1="135" y1="316" x2="365" y2="316" />
      <line x1="133" y1="332" x2="367" y2="332" />
      <line x1="132" y1="348" x2="368" y2="348" />
      <line x1="132" y1="364" x2="368" y2="364" />
      <line x1="132" y1="380" x2="368" y2="380" />
      <line x1="132" y1="396" x2="368" y2="396" />
      <line x1="132" y1="412" x2="368" y2="412" />
      <line x1="132" y1="428" x2="368" y2="428" />
      <line x1="133" y1="444" x2="367" y2="444" />
      <line x1="135" y1="460" x2="365" y2="460" />
      <line x1="140" y1="476" x2="360" y2="476" />
      <line x1="150" y1="492" x2="350" y2="492" />
    </g>

    <!-- Minute Track -->
    <circle cx="250" cy="400" r="114" fill="none" stroke="#60a5fa" stroke-width="0.75" opacity="0.45" />
    <g fill="#93c5fd" font-family="'Space Mono', monospace" font-size="6" text-anchor="middle" opacity="0.9">
      <text x="250" y="296">60</text>
      <text x="354" y="402">15</text>
      <text x="250" y="508">30</text>
      <text x="146" y="402">45</text>
    </g>

    <!-- Rhodium Plated Hour Indices -->
    <polygon points="247,294 253,294 251,320 249,320" fill="#ffffff" stroke="#334155" stroke-width="0.75" />
    <polygon points="302,308 307,312 291,333 287,330" fill="#ffffff" stroke="#334155" stroke-width="0.75" />
    <polygon points="342,347 344,353 323,365 320,360" fill="#ffffff" stroke="#334155" stroke-width="0.75" />
    <polygon points="356,397 356,403 330,401 330,399" fill="#ffffff" stroke="#334155" stroke-width="0.75" />
    <polygon points="344,447 342,453 320,440 323,435" fill="#ffffff" stroke="#334155" stroke-width="0.75" />
    <polygon points="307,488 302,492 287,470 291,467" fill="#ffffff" stroke="#334155" stroke-width="0.75" />
    <!-- Date Aperture at 6 o'clock -->
    <rect x="240" y="468" width="20" height="15" rx="1.5" fill="#0b132b" stroke="#ffffff" stroke-width="1" />
    <text x="250" y="480" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9" text-anchor="middle">24</text>
    <polygon points="193,488 198,492 213,470 209,467" fill="#ffffff" stroke="#334155" stroke-width="0.75" />
    <polygon points="156,447 158,453 180,440 177,435" fill="#ffffff" stroke="#334155" stroke-width="0.75" />
    <polygon points="144,397 144,403 170,401 170,399" fill="#ffffff" stroke="#334155" stroke-width="0.75" />
    <polygon points="158,347 156,353 177,365 180,360" fill="#ffffff" stroke="#334155" stroke-width="0.75" />
    <polygon points="198,308 193,312 209,333 213,330" fill="#ffffff" stroke="#334155" stroke-width="0.75" />

    <!-- Typography -->
    <path d="M246,340 C246,335 248,333 250,333 C252,333 254,335 254,340 C254,342 253,343 252,344 L255,344 L255,345 L251,345 C250.5,344.5 250,344 249.5,344 L245,345 L245,344 L248,344 C247,343 246,342 246,340 Z" fill="#ffffff" />
    <text x="250" y="354" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="8" letter-spacing="1.5" text-anchor="middle">OMEGA</text>
    <text x="250" y="362" fill="#93c5fd" font-family="'Playfair Display', serif" font-style="italic" font-size="6.5" text-anchor="middle">Seamaster</text>
    <text x="250" y="440" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="4.5" letter-spacing="0.5" text-anchor="middle">CO-AXIAL MASTER CHRONOMETER</text>
    <text x="250" y="447" fill="#60a5fa" font-family="'Plus Jakarta Sans', sans-serif" font-size="4.5" letter-spacing="0.5" text-anchor="middle">150m / 500ft</text>

    <!-- Hands at 10:10 Classic Watchmaker Pose -->
    <!-- Hour Hand -->
    <g transform="rotate(-62 250 400)">
      <polygon points="246,400 246,340 242,340 250,325 258,340 254,340 254,400" fill="#ffffff" stroke="#334155" stroke-width="1" />
      <line x1="250" y1="385" x2="250" y2="345" stroke="#eff6ff" stroke-width="2.5" />
    </g>
    <!-- Minute Hand -->
    <g transform="rotate(38 250 400)">
      <polygon points="247,400 248,300 250,292 252,300 253,400" fill="#ffffff" stroke="#334155" stroke-width="1" />
      <line x1="250" y1="385" x2="250" y2="305" stroke="#eff6ff" stroke-width="2" />
    </g>
    <!-- Cyan Needle Seconds Hand -->
    <g transform="rotate(215 250 400)">
      <line x1="250" y1="435" x2="250" y2="288" stroke="#38bdf8" stroke-width="1.2" />
      <polygon points="247,300 253,300 250,290" fill="#38bdf8" />
      <circle cx="250" cy="400" r="4.5" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="250" cy="400" r="1.5" fill="#1e3a8a" />
    </g>

    <!-- Sapphire Crystal Flare -->
    <circle cx="250" cy="400" r="118" fill="url(#blue-glass-glare)" />
    <!-- Glare Arc Highlight -->
    <path d="M165,325 A118,118 0 0,1 325,305" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.5" />
  </g>
</svg>