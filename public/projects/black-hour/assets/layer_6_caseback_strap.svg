<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="100%" height="100%">
  <defs>
    <linearGradient id="caseback-strap-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="25%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="75%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="caseback-steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="40%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <!-- Top Strap Segment -->
  <path d="M190,200 L200,60 Q250,50 300,60 L310,200 Z" fill="url(#caseback-strap-grad)" />
  <line x1="200" y1="62" x2="190" y2="200" stroke="#93c5fd" stroke-width="2" stroke-dasharray="4 3" />
  <line x1="300" y1="62" x2="310" y2="200" stroke="#93c5fd" stroke-width="2" stroke-dasharray="4 3" />
  <!-- Bottom Strap Segment with Steel Deployant Clasp -->
  <path d="M190,450 L200,600 Q250,610 300,600 L310,450 Z" fill="url(#caseback-strap-grad)" />
  <line x1="190" y1="450" x2="200" y2="598" stroke="#93c5fd" stroke-width="2" stroke-dasharray="4 3" />
  <line x1="310" y1="450" x2="300" y2="598" stroke="#93c5fd" stroke-width="2" stroke-dasharray="4 3" />
  <!-- Deployant Clasp Buckle -->
  <rect x="220" y="520" width="60" height="30" rx="3" fill="#cbd5e1" stroke="#334155" stroke-width="1.5" />
  <text x="250" y="538" fill="#1e293b" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="7" letter-spacing="1" text-anchor="middle">OMEGA</text>

  <!-- Exhibition Sapphire Case Back -->
  <ellipse cx="250" cy="325" rx="155" ry="125" fill="url(#caseback-steel)" stroke="#1e293b" stroke-width="2" />
  <!-- Wave-edged Case Back Bezel -->
  <ellipse cx="250" cy="325" rx="145" ry="115" fill="#0f172a" stroke="#64748b" stroke-width="1" />
  <!-- Exhibition Window -->
  <ellipse cx="250" cy="325" rx="115" ry="90" fill="#020617" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />
  <!-- Engraved Horological Markings -->
  <g fill="#94a3b8" font-family="'Space Mono', monospace" font-size="6" text-anchor="middle">
    <text x="250" y="255">AQUA TERRA 150M • 15,000 GAUSS</text>
    <text x="250" y="405">STAINLESS STEEL • SWISS MADE</text>
  </g>
</svg>