<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  <!-- Outer Horological Bezel Ring -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#brand-grad)" stroke-width="1.75" />
  <circle cx="50" cy="50" r="40" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.6" />
  <!-- Diamond Faceted Compass Star -->
  <polygon points="50,14 55,45 86,50 55,55 50,86 45,55 14,50 45,45" fill="url(#brand-grad)" />
  <circle cx="50" cy="50" r="4" fill="#0b0c10" stroke="#ffffff" stroke-width="1" />
</svg>