<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VEX — Shaping Tomorrow</title>

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        },
      },
    }
  </script>

  <style>
    /* ─── Global Body Typography ─────────────────────────────── */
    body {
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: #000;
      color: #fff;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    /* ─── Liquid Glass CSS ───────────────────────────────────── */
    .liquid-glass {
      background: rgba(0, 0, 0, 0.4);
      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }

    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.3) 0%,
        rgba(255, 255, 255, 0.1) 20%,
        rgba(255, 255, 255, 0) 40%,
        rgba(255, 255, 255, 0) 60%,
        rgba(255, 255, 255, 0.1) 80%,
        rgba(255, 255, 255, 0.3) 100%
      );
      -webkit-mask: linear-gradient(#fff 0 0) content-box,
                    linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    button.liquid-glass:hover::before {
      opacity: 0;
    }

    /* ─── Animated Heading Character Style ───────────────────── */
    .hero-char {
      display: inline-block;
      opacity: 0;
      transform: translateX(-18px);
      transition: opacity 500ms ease, transform 500ms ease;
    }

    .hero-char.active {
      opacity: 1;
      transform: translateX(0);
    }
  </style>
</head>
<body class="w-full h-screen overflow-hidden">

  <!-- ─── Root Container ──────────────────────────────────────── -->
  <div class="relative w-full h-screen overflow-hidden flex flex-col">

    <!-- ─── Video Background (Full screen, RAW, no overlay) ───── -->
    <video
      class="absolute inset-0 w-full h-full object-cover"
      src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260403_050628_c4e32401-fab4-4a27-b7a8-6e9291cd5959.mp4"
      autoplay
      loop
      muted
      playsinline
    ></video>

    <!-- ─── Content Layer ─────────────────────────────────────── -->
    <div class="relative z-10 flex flex-col h-full">

      <!-- ─── Navbar ──────────────────────────────────────────── -->
      <div class="px-6 md:px-12 lg:px-16 pt-6">
        <nav class="liquid-glass rounded-xl px-4 py-2 flex items-center justify-between">
          <!-- Logo -->
          <span class="text-2xl font-semibold tracking-tight text-white">
            VEX
          </span>

          <!-- Center links (hidden on mobile, visible md+) -->
          <div class="hidden md:flex items-center gap-8">
            <a href="#" class="text-sm text-white hover:text-gray-300 transition-colors duration-200">Story</a>
            <a href="#" class="text-sm text-white hover:text-gray-300 transition-colors duration-200">Investing</a>
            <a href="#" class="text-sm text-white hover:text-gray-300 transition-colors duration-200">Building</a>
            <a href="#" class="text-sm text-white hover:text-gray-300 transition-colors duration-200">Advisory</a>
          </div>

          <!-- CTA Button -->
          <button class="bg-white text-black px-6 py-2 rounded-lg text-sm font-medium hover:bg-gray-100 transition-colors duration-200 cursor-pointer">
            Start a Chat
          </button>
        </nav>
      </div>

      <!-- ─── Hero Content (Pushed to bottom of viewport) ──────── -->
      <div class="flex-1 flex flex-col justify-end pb-12 lg:pb-16 px-6 md:px-12 lg:px-16">
        <div class="lg:grid lg:grid-cols-2 lg:items-end gap-8">

          <!-- Left Column - Main Content -->
          <div>
            <!-- Animated Heading -->
            <h1
              id="heroHeading"
              class="text-4xl md:text-5xl lg:text-6xl xl:text-7xl font-normal mb-4 text-white"
              style="letter-spacing: -0.04em;"
            >
              <!-- Populated via JavaScript with staggered characters -->
            </h1>

            <!-- Subheading -->
            <div id="subheadingWrapper" class="transition-opacity opacity-0" style="transition-duration: 1000ms;">
              <p class="text-base md:text-lg text-gray-300 mb-5">
                We back visionaries and craft ventures that define what comes next.
              </p>
            </div>

            <!-- Buttons Row -->
            <div id="buttonsWrapper" class="transition-opacity opacity-0" style="transition-duration: 1000ms;">
              <div class="flex flex-wrap gap-4">
                <button class="bg-white text-black px-8 py-3 rounded-lg font-medium hover:bg-gray-100 transition-colors duration-200 cursor-pointer">
                  Start a Chat
                </button>
                <button class="liquid-glass border border-white/20 text-white px-8 py-3 rounded-lg font-medium hover:bg-white hover:text-black transition-all duration-200 cursor-pointer">
                  Explore Now
                </button>
              </div>
            </div>
          </div>

          <!-- Right Column - Tag -->
          <div
            id="tagWrapper"
            class="flex items-end justify-start lg:justify-end mt-8 lg:mt-0 transition-opacity opacity-0"
            style="transition-duration: 1000ms;"
          >
            <div class="liquid-glass border border-white/20 px-6 py-3 rounded-xl">
              <span class="text-lg md:text-xl lg:text-2xl font-light text-white">
                Investing. Building. Advisory.
              </span>
            </div>
          </div>

        </div>
      </div>

    </div>
  </div>

  <!-- ─── Script: Character Stagger & Timing Sequence ────────── -->
  <script>
    (function() {
      const headingText = "Shaping tomorrow\nwith vision and action.";
      const headingEl = document.getElementById('heroHeading');
      const lines = headingText.split('\n');
      const initialDelay = 200; // ms
      const charDelay = 30;     // ms
      const charDuration = 500; // ms

      const charSpans = [];

      lines.forEach((line, lineIndex) => {
        const lineSpan = document.createElement('span');
        lineSpan.className = 'block';

        const chars = line.split('');
        const lineLength = lines[0].length;

        chars.forEach((char, charIndex) => {
          const span = document.createElement('span');
          span.className = 'hero-char';
          span.textContent = char === ' ' ? '\u00A0' : char;

          const staggerDelay = (lineIndex * lineLength * charDelay) + (charIndex * charDelay);
          span.style.transitionDelay = staggerDelay + 'ms';

          lineSpan.appendChild(span);
          charSpans.push(span);
        });

        headingEl.appendChild(lineSpan);
      });

      // 1. Heading character-by-character animation starts at 200ms
      setTimeout(() => {
        charSpans.forEach(span => span.classList.add('active'));
      }, initialDelay);

      // 2. Subheading fade-in at 800ms (1000ms duration)
      setTimeout(() => {
        const sub = document.getElementById('subheadingWrapper');
        if (sub) sub.classList.remove('opacity-0');
      }, 800);

      // 3. Buttons row fade-in at 1200ms (1000ms duration)
      setTimeout(() => {
        const btn = document.getElementById('buttonsWrapper');
        if (btn) btn.classList.remove('opacity-0');
      }, 1200);

      // 4. Right column tag fade-in at 1400ms (1000ms duration)
      setTimeout(() => {
        const tag = document.getElementById('tagWrapper');
        if (tag) tag.classList.remove('opacity-0');
      }, 1400);
    })();
  </script>
</body>
</html>
