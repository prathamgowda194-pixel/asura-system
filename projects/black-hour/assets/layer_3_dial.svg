<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="dial-expl-grad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="40%" stop-color="#1d4ed8" />
      <stop offset="80%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0b132b" />
    </radialGradient>
  </defs>
  <!-- Elliptical Dial Face -->
  <ellipse cx="250" cy="250" rx="145" ry="118" fill="url(#dial-expl-grad)" stroke="#60a5fa" stroke-width="1.5" />
  <!-- Teak Planks in Perspective -->
  <g stroke="#09142b" stroke-width="1.5" opacity="0.6">
    <line x1="130" y1="180" x2="370" y2="180" />
    <line x1="120" y1="200" x2="380" y2="200" />
    <line x1="115" y1="220" x2="385" y2="220" />
    <line x1="112" y1="240" x2="388" y2="240" />
    <line x1="112" y1="260" x2="388" y2="260" />
    <line x1="115" y1="280" x2="385" y2="280" />
    <line x1="120" y1="300" x2="380" y2="300" />
    <line x1="130" y1="320" x2="370" y2="320" />
  </g>
  <!-- Omega Logo & Indices -->
  <text x="250" y="210" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="9" letter-spacing="1" text-anchor="middle">OMEGA</text>
  <text x="250" y="218" fill="#93c5fd" font-family="'Playfair Display', serif" font-style="italic" font-size="7" text-anchor="middle">Seamaster</text>
  <!-- Date Window at bottom -->
  <rect x="242" y="318" width="16" height="12" rx="1" fill="#0b132b" stroke="#ffffff" stroke-width="1" />
  <text x="250" y="327" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="7" text-anchor="middle">24</text>
  <!-- Faceted Indices around edge -->
  <polygon points="248,155 252,155 251,170 249,170" fill="#ffffff" />
  <polygon points="340,195 344,198 333,208 330,206" fill="#ffffff" />
  <polygon points="368,248 368,252 352,251 352,249" fill="#ffffff" />
  <polygon points="340,302 344,298 333,288 330,290" fill="#ffffff" />
  <polygon points="160,302 156,298 167,288 170,290" fill="#ffffff" />
  <polygon points="132,248 132,252 148,251 148,249" fill="#ffffff" />
  <polygon points="160,195 156,198 167,208 170,206" fill="#ffffff" />
  <!-- Center Hands -->
  <line x1="250" y1="250" x2="200" y2="215" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <line x1="250" y1="250" x2="310" y2="225" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <line x1="250" y1="250" x2="280" y2="305" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
</svg>