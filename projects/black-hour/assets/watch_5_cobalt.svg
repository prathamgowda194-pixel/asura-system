<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 800" width="100%" height="100%">
  <defs>
    <linearGradient id="cobalt-case" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#cbd5e1" />
      <stop offset="60%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <radialGradient id="electric-cobalt-dial" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="45%" stop-color="#1e3a8a" />
      <stop offset="80%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="cobalt-strap-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="25%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="75%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0b132b" />
    </linearGradient>
    <filter id="cobalt-shadow" x="-20%" y="-10%" width="140%" height="120%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <g filter="url(#cobalt-shadow)">
    <!-- Straps with Orange Edge Stitch -->
    <path d="M185,150 L195,40 Q250,30 305,40 L315,150 Z" fill="url(#cobalt-strap-grad)" />
    <line x1="193" y1="42" x2="183" y2="150" stroke="#f97316" stroke-width="2.5" stroke-dasharray="5 4" opacity="0.95" />
    <line x1="307" y1="42" x2="317" y2="150" stroke="#f97316" stroke-width="2.5" stroke-dasharray="5 4" opacity="0.95" />

    <path d="M185,650 L195,760 Q250,770 305,760 L315,650 Z" fill="url(#cobalt-strap-grad)" />
    <line x1="183" y1="650" x2="193" y2="758" stroke="#f97316" stroke-width="2.5" stroke-dasharray="5 4" opacity="0.95" />
    <line x1="317" y1="650" x2="307" y2="758" stroke="#f97316" stroke-width="2.5" stroke-dasharray="5 4" opacity="0.95" />

    <!-- Helium Valve & Crown -->
    <path d="M142,320 L128,312 C125,310 120,314 122,322 C124,330 129,332 133,330 L145,335 Z" fill="url(#cobalt-case)" stroke="#334155" stroke-width="1.2" />
    <path d="M380,380 L398,382 C402,382 405,386 405,400 C405,414 402,418 398,418 L380,420 Z" fill="url(#cobalt-case)" stroke="#475569" stroke-width="1.5" />

    <!-- Lugs -->
    <path d="M175,250 C170,210 178,160 185,145 L205,145 C198,165 195,205 195,250 Z" fill="url(#cobalt-case)" stroke="#334155" stroke-width="1" />
    <path d="M325,250 C330,210 322,160 315,145 L295,145 C302,165 305,205 305,250 Z" fill="url(#cobalt-case)" stroke="#334155" stroke-width="1" />
    <path d="M175,550 C170,590 178,640 185,655 L205,655 C198,635 195,595 195,550 Z" fill="url(#cobalt-case)" stroke="#334155" stroke-width="1" />
    <path d="M325,550 C330,590 322,640 315,655 L295,655 C302,635 305,595 305,550 Z" fill="url(#cobalt-case)" stroke="#334155" stroke-width="1" />

    <!-- Heavy-Duty Case -->
    <circle cx="250" cy="400" r="142" fill="url(#cobalt-case)" />
    
    <!-- Blue Ceramic Diving Bezel with Orange First 15 Minutes -->
    <circle cx="250" cy="400" r="134" fill="#0f172a" stroke="#1e3a8a" stroke-width="2" />
    <!-- Orange Rubber Segment from 12 to 3 o'clock -->
    <path d="M250,266 A134,134 0 0,1 384,400 L370,400 A120,120 0 0,0 250,280 Z" fill="#ea580c" />
    <polygon points="250,270 245,280 255,280" fill="#ffffff" />
    <circle cx="250" cy="277" r="2.5" fill="#38bdf8" />
    <g fill="#f8fafc" font-family="'Space Mono', monospace" font-weight="700" font-size="8" text-anchor="middle">
      <text x="310" y="300">10</text>
      <text x="355" y="365">20</text>
      <text x="350" y="445">30</text>
      <text x="300" y="510">40</text>
      <text x="195" y="510">50</text>
    </g>

    <!-- Radiant Cobalt Dial -->
    <circle cx="250" cy="400" r="116" fill="url(#electric-cobalt-dial)" stroke="#38bdf8" stroke-width="0.8" />

    <!-- Distinctive Orange Arabic Numerals (12, 6, 9) -->
    <text x="250" y="315" fill="#f97316" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" text-anchor="middle">12</text>
    <text x="165" y="406" fill="#f97316" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" text-anchor="middle">9</text>
    <text x="250" y="495" fill="#f97316" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" text-anchor="middle">6</text>

    <!-- Rhodium Hour Markers -->
    <g fill="#ffffff" stroke="#334155" stroke-width="1">
      <polygon points="302,308 307,312 291,333 287,330" />
      <polygon points="342,347 344,353 323,365 320,360" />
      <!-- Date window at 3 -->
      <rect x="330" y="392" width="18" height="15" rx="1.5" fill="#020617" stroke="#ffffff" stroke-width="1" />
      <text x="339" y="403" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9" text-anchor="middle">12</text>
      <polygon points="344,447 342,453 320,440 323,435" />
      <polygon points="307,488 302,492 287,470 291,467" />
      <polygon points="193,488 198,492 213,470 209,467" />
      <polygon points="156,447 158,453 180,440 177,435" />
      <polygon points="158,347 156,353 177,365 180,360" />
      <polygon points="198,308 193,312 209,333 213,330" />
    </g>

    <!-- Text -->
    <path d="M246,340 C246,335 248,333 250,333 C252,333 254,335 254,340 C254,342 253,343 252,344 L255,344 L255,345 L251,345 C250.5,344.5 250,344 249.5,344 L245,345 L245,344 L248,344 C247,343 246,342 246,340 Z" fill="#ffffff" />
    <text x="250" y="354" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="8" letter-spacing="1.5" text-anchor="middle">OMEGA</text>
    <text x="250" y="362" fill="#f97316" font-family="'Playfair Display', serif" font-style="italic" font-size="6.5" text-anchor="middle">Seamaster</text>
    <text x="250" y="440" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="4.5" letter-spacing="0.5" text-anchor="middle">PLANET OCEAN 600m</text>
    <text x="250" y="447" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="4.5" letter-spacing="0.5" text-anchor="middle">CO-AXIAL MASTER CHRONOMETER</text>

    <!-- Broad Arrow Hands -->
    <g transform="rotate(-62 250 400)">
      <polygon points="246,400 246,335 241,335 250,320 259,335 254,335 254,400" fill="#ffffff" stroke="#334155" stroke-width="1.5" />
    </g>
    <g transform="rotate(35 250 400)">
      <polygon points="247,400 247,300 242,300 250,285 258,300 253,300 253,400" fill="#ffffff" stroke="#334155" stroke-width="1.5" />
    </g>
    <!-- Bright Orange Tipped Seconds Hand -->
    <g transform="rotate(150 250 400)">
      <line x1="250" y1="435" x2="250" y2="285" stroke="#f97316" stroke-width="1.5" />
      <polygon points="246,298 254,298 250,285" fill="#f97316" />
      <circle cx="250" cy="400" r="4.5" fill="#ffffff" stroke="#f97316" stroke-width="1.5" />
    </g>

    <path d="M165,325 A116,116 0 0,1 325,305" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
  </g>
</svg>