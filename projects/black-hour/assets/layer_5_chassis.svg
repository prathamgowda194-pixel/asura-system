<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="chassis-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#e2e8f0" />
      <stop offset="60%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <!-- 4 Sculpted Lugs in 3D Perspective -->
  <!-- Top Left Lug -->
  <polygon points="175,170 140,80 165,80 200,160" fill="url(#chassis-metal)" stroke="#334155" stroke-width="1" />
  <!-- Top Right Lug -->
  <polygon points="325,170 360,80 335,80 300,160" fill="url(#chassis-metal)" stroke="#334155" stroke-width="1" />
  <!-- Bottom Left Lug -->
  <polygon points="175,330 140,420 165,420 200,340" fill="url(#chassis-metal)" stroke="#334155" stroke-width="1" />
  <!-- Bottom Right Lug -->
  <polygon points="325,330 360,420 335,420 300,340" fill="url(#chassis-metal)" stroke="#334155" stroke-width="1" />
  <!-- Middle Case Ring -->
  <ellipse cx="250" cy="250" rx="160" ry="130" fill="url(#chassis-metal)" stroke="#1e293b" stroke-width="2" />
  <ellipse cx="250" cy="250" rx="138" ry="110" fill="#0f172a" />
  <!-- Crown Tube & Crown at 3 o'clock -->
  <path d="M400,235 L425,238 C428,238 430,242 430,250 C430,258 428,262 425,262 L400,265 Z" fill="url(#chassis-metal)" stroke="#475569" stroke-width="1.5" />
</svg>