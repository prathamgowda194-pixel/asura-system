<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 800" width="100%" height="100%">
  <defs>
    <linearGradient id="white-steel-case" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#e2e8f0" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="steel-bracelet-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="15%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="85%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <filter id="white-watch-shadow" x="-20%" y="-10%" width="140%" height="120%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <g filter="url(#white-watch-shadow)">
    <!-- Stainless Steel 5-Link Bracelet Top & Bottom -->
    <path d="M180,150 L190,40 Q250,30 310,40 L320,150 Z" fill="url(#steel-bracelet-grad)" />
    <!-- Link Rows -->
    <line x1="187" y1="70" x2="313" y2="70" stroke="#475569" stroke-width="1.5" />
    <line x1="184" y1="100" x2="316" y2="100" stroke="#475569" stroke-width="1.5" />
    <line x1="182" y1="130" x2="318" y2="130" stroke="#475569" stroke-width="1.5" />

    <path d="M180,650 L190,760 Q250,770 310,760 L320,650 Z" fill="url(#steel-bracelet-grad)" />
    <line x1="182" y1="670" x2="318" y2="670" stroke="#475569" stroke-width="1.5" />
    <line x1="184" y1="700" x2="316" y2="700" stroke="#475569" stroke-width="1.5" />
    <line x1="187" y1="730" x2="313" y2="730" stroke="#475569" stroke-width="1.5" />

    <!-- Lugs -->
    <path d="M175,250 C170,210 178,160 185,145 L205,145 C198,165 195,205 195,250 Z" fill="url(#white-steel-case)" stroke="#334155" stroke-width="1" />
    <path d="M325,250 C330,210 322,160 315,145 L295,145 C302,165 305,205 305,250 Z" fill="url(#white-steel-case)" stroke="#334155" stroke-width="1" />
    <path d="M175,550 C170,590 178,640 185,655 L205,655 C198,635 195,595 195,550 Z" fill="url(#white-steel-case)" stroke="#334155" stroke-width="1" />
    <path d="M325,550 C330,590 322,640 315,655 L295,655 C302,635 305,595 305,550 Z" fill="url(#white-steel-case)" stroke="#334155" stroke-width="1" />

    <!-- Helium Valve & Crown -->
    <path d="M142,320 L128,312 C125,310 120,314 122,322 C124,330 129,332 133,330 L145,335 Z" fill="url(#white-steel-case)" stroke="#334155" stroke-width="1.2" />
    <path d="M380,380 L398,382 C402,382 405,386 405,400 C405,414 402,418 398,418 L380,420 Z" fill="url(#white-steel-case)" stroke="#475569" stroke-width="1.5" />

    <!-- Outer Case -->
    <circle cx="250" cy="400" r="140" fill="url(#white-steel-case)" />
    
    <!-- Black Ceramic Diving Bezel -->
    <circle cx="250" cy="400" r="132" fill="#090d16" stroke="#64748b" stroke-width="1.5" />
    <polygon points="250,270 245,280 255,280" fill="#ffffff" />
    <circle cx="250" cy="277" r="2.5" fill="#38bdf8" />
    <g fill="#f8fafc" font-family="'Space Mono', monospace" font-weight="700" font-size="8" text-anchor="middle">
      <text x="310" y="300">10</text>
      <text x="355" y="365">20</text>
      <text x="350" y="445">30</text>
      <text x="300" y="510">40</text>
      <text x="195" y="510">50</text>
    </g>

    <!-- Polar White Ceramic Dial -->
    <circle cx="250" cy="400" r="115" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />

    <!-- Laser Wave Patterns (Blackened Grooves) -->
    <g fill="none" stroke="#cbd5e1" stroke-width="1.2" opacity="0.85">
      <path d="M150,330 Q175,325 200,330 T250,330 T300,330 T350,330" />
      <path d="M145,350 Q175,345 200,350 T250,350 T300,350 T355,350" />
      <path d="M140,370 Q175,365 200,370 T250,370 T300,370 T360,370" />
      <path d="M138,390 Q175,385 200,390 T250,390 T300,390 T362,390" />
      <path d="M138,410 Q175,405 200,410 T250,410 T300,410 T362,410" />
      <path d="M140,430 Q175,425 200,430 T250,430 T300,430 T360,430" />
      <path d="M145,450 Q175,445 200,450 T250,450 T300,450 T355,450" />
      <path d="M150,470 Q175,465 200,470 T250,470 T300,470 T350,470" />
    </g>

    <!-- Blackened Hour Markers with White Lume -->
    <g fill="#ffffff" stroke="#0f172a" stroke-width="1.5">
      <rect x="246" y="296" width="8" height="18" rx="2" />
      <circle cx="304" cy="318" r="5" />
      <circle cx="340" cy="360" r="5" />
      <rect x="338" y="396" width="18" height="8" rx="2" />
      <circle cx="340" cy="440" r="5" />
      <circle cx="304" cy="482" r="5" />
      <!-- Date window at 6 -->
      <rect x="242" y="474" width="16" height="13" rx="1.5" fill="#f8fafc" stroke="#0f172a" stroke-width="1.2" />
      <text x="250" y="484" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" text-anchor="middle">30</text>
      <circle cx="196" cy="482" r="5" />
      <circle cx="160" cy="440" r="5" />
      <rect x="144" y="396" width="18" height="8" rx="2" />
      <circle cx="160" cy="360" r="5" />
      <circle cx="196" cy="318" r="5" />
    </g>

    <!-- Text -->
    <path d="M246,340 C246,335 248,333 250,333 C252,333 254,335 254,340 C254,342 253,343 252,344 L255,344 L255,345 L251,345 C250.5,344.5 250,344 249.5,344 L245,345 L245,344 L248,344 C247,343 246,342 246,340 Z" fill="#0f172a" />
    <text x="250" y="354" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="8" letter-spacing="1.5" text-anchor="middle">OMEGA</text>
    <text x="250" y="362" fill="#dc2626" font-family="'Playfair Display', serif" font-style="italic" font-size="6.5" text-anchor="middle">Seamaster</text>
    <text x="250" y="440" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-size="4.5" letter-spacing="0.5" text-anchor="middle">PROFESSIONAL</text>
    <text x="250" y="447" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-size="4.5" letter-spacing="0.5" text-anchor="middle">300m / 1000ft</text>

    <!-- Blackened Skeleton Hands -->
    <g transform="rotate(-58 250 400)">
      <polygon points="247,400 246,340 250,330 254,340 253,400" fill="none" stroke="#0f172a" stroke-width="2.2" />
      <circle cx="250" cy="336" r="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.2" />
    </g>
    <g transform="rotate(45 250 400)">
      <polygon points="247,400 247,305 250,295 253,305 253,400" fill="none" stroke="#0f172a" stroke-width="2.2" />
      <circle cx="250" cy="302" r="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.2" />
    </g>
    <!-- Red Tip Seconds Hand -->
    <g transform="rotate(130 250 400)">
      <line x1="250" y1="435" x2="250" y2="290" stroke="#0f172a" stroke-width="1.2" />
      <circle cx="250" cy="310" r="3" fill="#dc2626" stroke="#0f172a" stroke-width="1" />
      <circle cx="250" cy="400" r="4" fill="#0f172a" />
    </g>

    <!-- Specular Highlight -->
    <path d="M165,325 A115,115 0 0,1 325,305" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.75" />
  </g>
</svg>