<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 800" width="100%" height="100%">
  <defs>
    <linearGradient id="black-steel-case" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#cbd5e1" />
      <stop offset="60%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="black-ceramic-dial" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="black-strap-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="25%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="75%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="ceramic-bezel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="black-watch-shadow" x="-20%" y="-10%" width="140%" height="120%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <g filter="url(#black-watch-shadow)">
    <!-- Straps -->
    <path d="M185,150 L195,40 Q250,30 305,40 L315,150 Z" fill="url(#black-strap-grad)" />
    <path d="M205,60 L295,60 M203,80 L297,80 M200,100 L300,100 M197,120 L303,120 M195,140 L305,140" stroke="#020617" stroke-width="2.5" opacity="0.8" />
    <path d="M185,650 L195,760 Q250,770 305,760 L315,650 Z" fill="url(#black-strap-grad)" />
    <path d="M195,660 L305,660 M197,680 L303,680 M200,700 L300,700 M203,720 L297,720 M205,740 L295,740" stroke="#020617" stroke-width="2.5" opacity="0.8" />

    <!-- Helium Valve at 10 o'clock -->
    <path d="M142,320 L128,312 C125,310 120,314 122,322 C124,330 129,332 133,330 L145,335 Z" fill="url(#black-steel-case)" stroke="#334155" stroke-width="1.2" />
    <!-- Crown at 3 o'clock -->
    <path d="M380,380 L398,382 C402,382 405,386 405,400 C405,414 402,418 398,418 L380,420 Z" fill="url(#black-steel-case)" stroke="#475569" stroke-width="1.5" />

    <!-- Lugs -->
    <path d="M175,250 C170,210 178,160 185,145 L205,145 C198,165 195,205 195,250 Z" fill="url(#black-steel-case)" stroke="#334155" stroke-width="1" />
    <path d="M325,250 C330,210 322,160 315,145 L295,145 C302,165 305,205 305,250 Z" fill="url(#black-steel-case)" stroke="#334155" stroke-width="1" />
    <path d="M175,550 C170,590 178,640 185,655 L205,655 C198,635 195,595 195,550 Z" fill="url(#black-steel-case)" stroke="#334155" stroke-width="1" />
    <path d="M325,550 C330,590 322,640 315,655 L295,655 C302,635 305,595 305,550 Z" fill="url(#black-steel-case)" stroke="#334155" stroke-width="1" />

    <!-- Outer Scalloped Case -->
    <circle cx="250" cy="400" r="140" fill="url(#black-steel-case)" />
    
    <!-- Ceramic Diving Bezel with White Enamel Hash Marks -->
    <circle cx="250" cy="400" r="132" fill="url(#ceramic-bezel-grad)" stroke="#64748b" stroke-width="1.5" />
    <!-- Bezel Lume Pip at 12 -->
    <polygon points="250,270 245,280 255,280" fill="#ffffff" />
    <circle cx="250" cy="277" r="2.5" fill="#38bdf8" />
    <!-- Bezel Numbers: 10, 20, 30, 40, 50 -->
    <g fill="#f8fafc" font-family="'Space Mono', monospace" font-weight="700" font-size="8" text-anchor="middle">
      <text x="310" y="300">10</text>
      <text x="355" y="365">20</text>
      <text x="350" y="445">30</text>
      <text x="300" y="510">40</text>
      <text x="195" y="510">50</text>
    </g>

    <!-- Dial: Black Ceramic with Laser Waves -->
    <circle cx="250" cy="400" r="115" fill="url(#black-ceramic-dial)" stroke="#475569" stroke-width="1" />

    <!-- Laser Wave Patterns (Seamaster DNA) -->
    <g fill="none" stroke="#334155" stroke-width="1.2" opacity="0.65">
      <path d="M150,330 Q175,325 200,330 T250,330 T300,330 T350,330" />
      <path d="M145,350 Q175,345 200,350 T250,350 T300,350 T355,350" />
      <path d="M140,370 Q175,365 200,370 T250,370 T300,370 T360,370" />
      <path d="M138,390 Q175,385 200,390 T250,390 T300,390 T362,390" />
      <path d="M138,410 Q175,405 200,410 T250,410 T300,410 T362,410" />
      <path d="M140,430 Q175,425 200,430 T250,430 T300,430 T360,430" />
      <path d="M145,450 Q175,445 200,450 T250,450 T300,450 T355,450" />
      <path d="M150,470 Q175,465 200,470 T250,470 T300,470 T350,470" />
    </g>

    <!-- Circular and Baton Luminous Hour Markers -->
    <g fill="#ffffff" stroke="#64748b" stroke-width="0.8">
      <rect x="246" y="296" width="8" height="18" rx="2" />
      <circle cx="304" cy="318" r="5" />
      <circle cx="340" cy="360" r="5" />
      <rect x="338" y="396" width="18" height="8" rx="2" />
      <circle cx="340" cy="440" r="5" />
      <circle cx="304" cy="482" r="5" />
      <!-- Date window at 6 -->
      <rect x="242" y="474" width="16" height="13" rx="1.5" fill="#020617" stroke="#ffffff" stroke-width="0.8" />
      <text x="250" y="484" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" text-anchor="middle">08</text>
      <circle cx="196" cy="482" r="5" />
      <circle cx="160" cy="440" r="5" />
      <rect x="144" y="396" width="18" height="8" rx="2" />
      <circle cx="160" cy="360" r="5" />
      <circle cx="196" cy="318" r="5" />
    </g>

    <!-- Text -->
    <path d="M246,340 C246,335 248,333 250,333 C252,333 254,335 254,340 C254,342 253,343 252,344 L255,344 L255,345 L251,345 C250.5,344.5 250,344 249.5,344 L245,345 L245,344 L248,344 C247,343 246,342 246,340 Z" fill="#ffffff" />
    <text x="250" y="354" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="8" letter-spacing="1.5" text-anchor="middle">OMEGA</text>
    <text x="250" y="362" fill="#ef4444" font-family="'Playfair Display', serif" font-style="italic" font-size="6.5" text-anchor="middle">Seamaster</text>
    <text x="250" y="440" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="4.5" letter-spacing="0.5" text-anchor="middle">PROFESSIONAL</text>
    <text x="250" y="447" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="4.5" letter-spacing="0.5" text-anchor="middle">300m / 1000ft</text>

    <!-- Skeleton Hands (Seamaster Signature) -->
    <!-- Hour Hand -->
    <g transform="rotate(-60 250 400)">
      <polygon points="247,400 246,340 250,330 254,340 253,400" fill="none" stroke="#ffffff" stroke-width="1.8" />
      <circle cx="250" cy="336" r="3" fill="#ffffff" />
    </g>
    <!-- Minute Hand -->
    <g transform="rotate(40 250 400)">
      <polygon points="247,400 247,305 250,295 253,305 253,400" fill="none" stroke="#ffffff" stroke-width="1.8" />
      <circle cx="250" cy="302" r="3" fill="#ffffff" />
    </g>
    <!-- Seconds Hand (Red Tip Lollipop) -->
    <g transform="rotate(180 250 400)">
      <line x1="250" y1="435" x2="250" y2="290" stroke="#f8fafc" stroke-width="1.2" />
      <circle cx="250" cy="310" r="3" fill="#ef4444" stroke="#ffffff" stroke-width="1" />
      <circle cx="250" cy="400" r="4" fill="#ffffff" />
    </g>

    <!-- Anti-Reflective Sapphire Glass Flare -->
    <circle cx="250" cy="400" r="115" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />
    <path d="M165,325 A115,115 0 0,1 325,305" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
  </g>
</svg>