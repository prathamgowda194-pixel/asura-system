<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sapphire-glare" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="85%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6" />
    </linearGradient>
    <radialGradient id="sapphire-edge" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="#38bdf8" stop-opacity="0.0" />
      <stop offset="96%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9" />
    </radialGradient>
  </defs>
  <!-- Elliptical Perspective Lens Ring -->
  <ellipse cx="250" cy="250" rx="160" ry="130" fill="url(#sapphire-glare)" stroke="url(#sapphire-edge)" stroke-width="4" />
  <path d="M140,200 Q250,140 350,180" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8" fill="none" />
</svg>