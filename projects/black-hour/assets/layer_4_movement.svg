<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="movement-plate" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="40%" stop-color="#cbd5e1" />
      <stop offset="80%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </radialGradient>
    <radialGradient id="gold-balance" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </radialGradient>
  </defs>
  <!-- Movement Base Plate -->
  <ellipse cx="250" cy="250" rx="142" ry="115" fill="url(#movement-plate)" stroke="#334155" stroke-width="2" />
  <!-- Côtes de Genève Arabesque Stripes -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.35">
    <path d="M150,220 C200,180 300,180 350,220" fill="none" />
    <path d="M140,240 C200,200 300,200 360,240" fill="none" />
    <path d="M140,260 C200,220 300,220 360,260" fill="none" />
    <path d="M150,280 C200,240 300,240 350,280" fill="none" />
  </g>
  <!-- Screws & Ruby Jewels -->
  <circle cx="210" cy="220" r="5" fill="#e11d48" stroke="#be123c" stroke-width="1" />
  <circle cx="285" cy="215" r="4.5" fill="#e11d48" stroke="#be123c" stroke-width="1" />
  <circle cx="270" cy="275" r="4.5" fill="#e11d48" stroke="#be123c" stroke-width="1" />
  <!-- Blued Screws -->
  <circle cx="190" cy="255" r="3.5" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="0.75" />
  <circle cx="310" cy="260" r="3.5" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="0.75" />
  <!-- Exposed Gold Balance Wheel with Hairspring -->
  <ellipse cx="230" cy="265" rx="35" ry="28" fill="none" stroke="url(#gold-balance)" stroke-width="4" />
  <ellipse cx="230" cy="265" rx="20" ry="16" fill="none" stroke="#facc15" stroke-width="1.5" stroke-dasharray="3 2" />
  <circle cx="230" cy="265" r="4" fill="#e11d48" />
  <!-- Oscillating Rotor with Omega Cutout Engraving -->
  <path d="M170,250 C170,180 210,150 250,150 C290,150 330,180 330,250 Z" fill="url(#movement-plate)" stroke="#475569" stroke-width="1.5" opacity="0.85" />
  <text x="250" y="190" fill="#b45309" font-family="'Space Mono', monospace" font-size="7" font-weight="700" letter-spacing="1" text-anchor="middle">OMEGA CO-AXIAL 8900</text>
  <text x="250" y="200" fill="#475569" font-family="'Space Mono', monospace" font-size="5" text-anchor="middle">THIRTY-NINE (39) JEWELS • SWISS</text>
</svg>